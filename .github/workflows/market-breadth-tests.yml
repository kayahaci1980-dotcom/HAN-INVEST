name: HAN INVEST Backend Tests

on:
  push:
    branches:
      - feature/market-breadth-entry-filter
  pull_request:
    branches:
      - auto-paper-rules-coinbase-okx

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pytest

      - name: Compile backend
        run: python -m compileall -q server/app

      - name: Run backend tests
        env:
          PYTHONPATH: server
        run: pytest -q server/tests
