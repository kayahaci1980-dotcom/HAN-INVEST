name: CoinPaprika market breadth tests

on:
  push:
    branches:
      - feature/coinpaprika-market-filter-final
    paths:
      - "server/app/market_breadth.py"
      - "server/tests/test_market_breadth.py"
      - ".github/workflows/market-breadth-tests.yml"
  pull_request:
    branches:
      - auto-paper-rules-coinbase-okx
    paths:
      - "server/app/market_breadth.py"
      - "server/tests/test_market_breadth.py"
      - ".github/workflows/market-breadth-tests.yml"

jobs:
  test-market-breadth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fastapi httpx pytest
      - run: PYTHONPATH=. pytest -q tests/test_market_breadth.py
