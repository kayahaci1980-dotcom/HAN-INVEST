name: HAN INVEST quality checks

on:
  push:
    branches:
      - fix/han-invest-quality-and-paper-safety
  pull_request:
    branches:
      - ui-exchange-tabs-top3
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: pip install -r server/requirements.txt
      - name: Run technical indicator tests
        working-directory: server
        run: python -m unittest discover -s tests -v

  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble Android debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: han-invest-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
