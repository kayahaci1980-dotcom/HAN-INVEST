name: Bybit Spot historical filter research

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical window in days (30-180)"
        required: true
        default: "90"
      symbols:
        description: "Comma-separated Bybit Spot USDT symbols"
        required: true
        default: "BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,LINKUSDT,AVAXUSDT,LTCUSDT,BCHUSDT"

permissions:
  contents: read

jobs:
  historical-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependency
        run: python -m pip install httpx==0.28.1
      - name: Run isolated Bybit Spot historical comparison
        working-directory: server
        run: |
          python research/bybit_historical_filter_test.py \
            --days "${{ inputs.days }}" \
            --symbols "${{ inputs.symbols }}" \
            --output bybit_historical_filter_report.csv
      - name: Upload CSV report
        uses: actions/upload-artifact@v4
        with:
          name: bybit-historical-filter-report
          path: server/bybit_historical_filter_report.csv
          if-no-files-found: error
          retention-days: 30
